name: Zen Scanner
on:
  schedule:
    - cron: "30 16 * * 1-5"   # 11:30 Central in summer
    - cron: "30 17 * * 1-5"   # 11:30 Central in winter
    - cron: "0 15 * * 6"      # Saturday review
  workflow_dispatch:
    inputs:
      mode:
        description: "scan or review"
        default: "scan"
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q yfinance pandas numpy
      - run: python run.py
        env:
          ZEN_MODE: ${{ github.event.inputs.mode || 'auto' }}
      - run: |
          git config user.name "zen-bot"
          git config user.email "zen-bot@users.noreply.github.com"
          git add -A
          git commit -m "Zen update" || echo "nothing new"
          git push
