name: Zen Scanner
on:
  schedule:
    - cron: "30 16 * * 1-5"   # 11:30 Central in summer (stock scan)
    - cron: "30 17 * * 1-5"   # 11:30 Central in winter
    - cron: "0 15 * * 6"      # Saturday review
    - cron: "30 22 * * 0-4"   # 5:30 PM Central in summer, Sun-Thu (futures, Asia open)
    - cron: "30 23 * * 0-4"   # 5:30 PM Central in winter
    - cron: "0 2 * * 1-5"     # 9:00 PM Central in summer, Sun-Thu evenings (futures, Asia mid)
    - cron: "0 3 * * 1-5"     # 9:00 PM Central in winter
  workflow_dispatch:
    inputs:
      mode:
        description: "scan, futures, review or alert-test"
        default: "scan"
permissions:
  contents: write
concurrency:
  group: zen
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q yfinance pandas numpy
      - run: python run.py
        env:
          ZEN_MODE: ${{ github.event.inputs.mode || 'auto' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - run: |
          git config user.name "zen-bot"
          git config user.email "zen-bot@users.noreply.github.com"
          git add -A
          git commit -m "Zen update" || echo "nothing new"
          git pull --rebase -X theirs || true
          git push
