name: Zen Scanner
on:
  schedule:
    - cron: "30 16 * * 1-5"   # 11:30 Central in summer (stock scan)
    - cron: "30 17 * * 1-5"   # 11:30 Central in winter
    # Evening scan before the close (Potter: buy into the overnight move), ~2:17 PM Central
    # with a backup 20 min later; summer and winter copies. Must finish before the 3:00 close.
    - cron: "17,37 19,20 * * 1-5"
    - cron: "0 15 * * 6"      # Saturday review
    # Futures, Sun-Thu evenings. GitHub drops or delays runs at busy times (on the hour),
    # so each scan is scheduled at odd minutes with a backup 30 min later; whichever runs
    # first does the scan and the rest exit (run.py checks the time window and if it's done).
    - cron: "27 22,23 * * 0-4"   # ~5:27 PM Central (summer: 22:27 UTC, winter: 23:27 UTC)
    - cron: "57 22,23 * * 0-4"   # backup ~5:57 PM Central
    - cron: "7 2,3 * * 1-5"      # ~9:07 PM Central (summer: 02:07 UTC, winter: 03:07 UTC)
    - cron: "37 2,3 * * 1-5"     # backup ~9:37 PM Central
  workflow_dispatch:
    inputs:
      mode:
        description: "scan, futures, review or alert-test"
        default: "scan"
permissions:
  contents: write
concurrency:
  group: zen
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q yfinance pandas numpy
      - run: python run.py
        env:
          ZEN_MODE: ${{ github.event.inputs.mode || 'auto' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - run: |
          git config user.name "zen-bot"
          git config user.email "zen-bot@users.noreply.github.com"
          git add -A
          git commit -m "Zen update" || echo "nothing new"
          git pull --rebase -X theirs || true
          git push
